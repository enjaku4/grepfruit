name: Benchmark

on:
  push:
  workflow_dispatch:

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-latest

    name: Benchmark
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install the latest grepfruit release
        run: gem install grepfruit
      - name: Run benchmark
        run: ruby benchmark/run.rb
